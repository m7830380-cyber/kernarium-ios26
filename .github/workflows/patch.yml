name: patch
on: workflow_dispatch
jobs:
  p:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download 1.0b9-beta -R imxieyi/Kernarium -p 'Andarium-1.0-9.ipa' -O in.ipa
      - run: bash patch.sh in.ipa Andarium-1.0-9-ios26.ipa 26.0
      - uses: actions/upload-artifact@v4
        with: { name: ipa, path: Andarium-1.0-9-ios26.ipa, compression-level: 0 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: report, path: report.txt }
